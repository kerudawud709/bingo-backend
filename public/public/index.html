<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeketema Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
            margin: 0;
            padding: 16px;
        }
        .title { font-size: 1.4rem; font-weight: bold; margin-bottom: 4px; }
        .user-badge { font-size: 0.85rem; color: #94a3b8; margin-bottom: 12px; }
        
        .admin-panel {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 10px;
            max-width: 340px;
            margin: 0 auto 15px auto;
            display: none;
        }
        .admin-btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 10px;
            font-size: 0.95rem;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin: 4px;
        }
        .admin-btn.pause { background: #eab308; }

        .admin-input-group {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #475569;
        }
        .admin-input {
            width: 80%;
            padding: 6px;
            margin: 3px 0;
            background: #0f172a;
            color: white;
            border: 1px solid #334155;
            border-radius: 4px;
            text-align: center;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        #cartela-screen { display: block; }
        .selection-title { font-size: 1.1rem; margin-bottom: 15px; }
        .cartela-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-width: 360px;
            margin: 0 auto;
        }
        .cartela-button {
            background: #1e293b;
            color: white;
            border: 1px solid #334155;
            border-radius: 9px;
            padding: 14px 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .cartela-button:active { background: #2563eb; }
        .cartela-button.unavailable {
            background: #334155;
            color: #64748b;
            text-decoration: line-through;
            cursor: not-allowed;
        }
        #game-screen { display: none; }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 340px;
            margin: 0 auto 12px auto;
        }
        .badge-group {
            display: flex;
            gap: 6px;
        }
        .balance-badge {
            background: #1e293b;
            color: #38bdf8;
            border: 1px solid #0284c7;
            padding: 8px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .prize-badge {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #ffffff;
            padding: 8px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.4);
        }
        .card-number { font-size: 1rem; font-weight: bold; margin-bottom: 12px; }
        .drawn-container {
            background: #1e293b;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 12px;
        }
        #drawn-box {
            font-size: 2.8rem;
            color: #38bdf8;
            font-weight: bold;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-width: 340px;
            margin: 0 auto 20px auto;
        }
        .header-cell {
            background: #f97316;
            color: #0f172a;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 10px 0;
            border-radius: 8px;
        }
        .cell {
            background: #1e293b;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            border: 1px solid #334155;
            cursor: pointer;
        }
        .cell.marked {
            background: #22c55e;
            border-color: #4ade80;
            color: #052e16;
        }
        .cell.star {
            background: #eab308;
            border-color: #fde047;
            color: #422006;
        }
        .claim-button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            border-radius: 10px;
            width: 100%;
            max-width: 340px;
            font-weight: bold;
            cursor: pointer;
        }
        .back-button {
            background: #475569;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="title">🎲 Yeketema Bingo</div>
    <div class="user-badge">👤 <span id="player-name">Connecting...</span> | 💳 <span id="cartela-balance">0.00</span> ETB</div>

    <!-- ADMIN CONTROLS PANEL -->
    <div id="admin-panel" class="admin-panel">
        <div style="font-weight: bold; margin-bottom: 8px; color: #f59e0b;">⚙️ Admin Controls</div>
        <button class="admin-btn" onclick="adminStartGame()">🚀 Start Game</button>
        <button class="admin-btn pause" onclick="adminTogglePause()">⏸️ Pause / Resume</button>
        <div style="margin-top: 8px; font-size: 0.85rem;">
            Call Speed: 
            <select id="speed-select" onchange="adminSetSpeed(this.value)" style="background:#0f172a; color:white; border:1px solid #334155; padding:4px; border-radius:4px;">
                <option value="5000">5 seconds</option>
                <option value="4000" selected>4 seconds</option>
                <option value="3000">3 seconds</option>
                <option value="2000">2 seconds</option>
            </select>
        </div>

        <!-- QUICK BALANCE ADD FOR ADMIN -->
        <div class="admin-input-group">
            <div style="font-size: 0.8rem; font-weight: bold; color: #38bdf8; margin-bottom: 4px;">💳 Credit User Balance:</div>
            <input type="number" id="admin-target-id" class="admin-input" placeholder="User Telegram ID (e.g. 5486724656)">
            <input type="number" id="admin-amount" class="admin-input" placeholder="Amount (e.g. 50)">
            <button class="admin-btn" style="background: #0284c7; width: 85%; margin-top: 6px;" onclick="adminAddBalance()">➕ Deposit Money</button>
        </div>
    </div>

    <!-- CARTELA SELECTION SCREEN -->
    <div id="cartela-screen">
        <div class="selection-title">🎫 Choose Your Cartela</div>

        <!-- CUSTOM STAKE INPUT -->
        <div style="background: #1e293b; padding: 10px; border-radius: 10px; max-width: 340px; margin: 0 auto 12px auto; border: 1px solid #334155;">
            <label for="stake-input" style="font-weight: bold; font-size: 0.85rem; color: #38bdf8; display: block; margin-bottom: 6px;">
                💰 Enter Stake Amount (Min 5 ETB):
            </label>
            <input 
                type="number" 
                id="stake-input" 
                min="5" 
                value="10" 
                placeholder="Enter amount (min 5)" 
                oninput="updateStake(this.value)"
                style="width: 90%; padding: 8px; background: #0f172a; color: white; border: 1px solid #0284c7; border-radius: 6px; font-weight: bold; font-size: 1rem; text-align: center;"
            >
        </div>

        <div id="cartela-grid" class="cartela-grid"></div>
    </div>

    <!-- GAME BOARD SCREEN -->
    <div id="game-screen">
        <div class="top-bar">
            <button class="back-button" onclick="backToCartelas()">← Change</button>
            <div class="badge-group">
                <div class="balance-badge">
                    💳 <span id="user-balance">0.00</span> ETB
                </div>
                <div class="prize-badge">
                    🏆 Win: <span id="prize-amount">0.00</span> ETB
                </div>
            </div>
        </div>

        <div class="toggle-container">
            <span>Manual</span>
            <input type="checkbox" id="automark-toggle" checked>
            <span>Auto ⚡</span>
            <span style="margin-left: 8px;">🎙️ Voice</span>
            <input type="checkbox" id="voice-toggle" checked>
        </div>

        <div id="selected-card-number" class="card-number">Cartela --</div>

        <div class="drawn-container">
            <small style="color: #94a3b8;">CURRENT NUMBER</small>
            <div id="drawn-box">--</div>
        </div>

        <div class="grid" id="bingo-grid"></div>

        <button class="claim-button" onclick="claimBingo()">Claim Bingo! 🏆</button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        // WEB AUDIO CONTEXT FOR SFX
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let currentVoiceAudio = null;

        function getLetterForNumber(num) {
            if (num <= 15) return 'B';
            if (num <= 30) return 'I';
            if (num <= 45) return 'N';
            if (num <= 60) return 'G';
            return 'O';
        }

        // PLAY AMHARIC VOICE CLIP FROM GITHUB REPO
        function playVoiceCall(num) {
            if (!document.getElementById("voice-toggle").checked) return;

            if (currentVoiceAudio) {
                currentVoiceAudio.pause();
                currentVoiceAudio.currentTime = 0;
            }

            const letter = getLetterForNumber(num);
            const audioUrl = `https://raw.githubusercontent.com/kerudawud709/bingo-webapp/main/audio/${letter}${num}.mp3`;

            currentVoiceAudio = new Audio(audioUrl);
            currentVoiceAudio.play().catch((err) => {
                console.warn("Audio play blocked or file missing:", err);
            });
        }

        function playPopSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playWinSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.12);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime + index * 0.12);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + index * 0.12 + 0.3);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + index * 0.12);
                osc.stop(audioCtx.currentTime + index * 0.12 + 0.3);
            });
        }

        // Connect dynamically to relative path host
        const socket = io({
            transports: ["polling", "websocket"],
            upgrade: true,
            reconnection: true,
            reconnectionAttempts: 10,
            reconnectionDelay: 2000
        });

        let myCard = [];
        let myCartelaNumber = null;
        let drawnHistory = [];
        let currentStake = 10;

        function updateStake(value) {
            const amount = parseFloat(value);
            if (!isNaN(amount)) {
                currentStake = amount;
            }
        }

        function updateBalanceDisplay(val) {
            const formatted = parseFloat(val).toFixed(2);
            document.getElementById("user-balance").innerText = formatted;
            document.getElementById("cartela-balance").innerText = formatted;
        }

        socket.on("connect", () => {
            const tgUser = tg?.initDataUnsafe?.user || {
                id: 5486724656,
                first_name: "Admin",
                username: "Admin"
            };
            socket.emit("authenticate", tgUser);
        });

        socket.on("account_data", (data) => {
            document.getElementById("player-name").innerText = data.username || `Player ${data.telegram_id}`;
            if (data.balance !== undefined) {
                updateBalanceDisplay(data.balance);
            }
            if (data.isAdmin || String(data.telegram_id) === "5486724656") {
                document.getElementById("admin-panel").style.display = "block";
                document.getElementById("admin-target-id").value = data.telegram_id;
            }
        });

        socket.on("balance_updated", (data) => {
            if (data.balance !== undefined) {
                updateBalanceDisplay(data.balance);
            }
        });

        socket.on("balance_update", (data) => {
            if (data.balance !== undefined) {
                updateBalanceDisplay(data.balance);
            }
        });

        socket.on("prize_pool_update", (data) => {
            document.getElementById("prize-amount").innerText = parseFloat(data.prize).toFixed(2);
        });

        function adminStartGame() { socket.emit("admin_start_game"); }
        function adminTogglePause() { socket.emit("admin_toggle_pause"); }
        function adminSetSpeed(val) { socket.emit("admin_set_speed", val); }

        function adminAddBalance() {
            const targetTelegramId = document.getElementById("admin-target-id").value;
            const amount = document.getElementById("admin-amount").value;

            if (!targetTelegramId || !amount) {
                alert("Please enter both Telegram ID and Amount!");
                return;
            }

            socket.emit("admin_add_balance", {
                targetTelegramId: Number(targetTelegramId),
                amount: parseFloat(amount)
            });
        }

        socket.on("admin_success", (data) => alert(data.message));
        socket.on("game_pause_status", (data) => alert(data.isPaused ? "⏸️ Game Paused" : "▶️ Game Resumed"));

        socket.on("cartela_list", (data) => showCartelaList(data.cartelas));

        function showCartelaList(available) {
            const container = document.getElementById("cartela-grid");
            container.innerHTML = "";
            for (let i = 1; i <= 75; i++) {
                const button = document.createElement("button");
                button.innerText = i;
                button.className = "cartela-button";
                if (!available.includes(i)) {
                    button.classList.add("unavailable");
                    button.disabled = true;
                } else {
                    button.onclick = () => selectCartela(i);
                }
                container.appendChild(button);
            }
        }

        function selectCartela(number) {
            if (currentStake < 5) {
                alert("⚠️ Minimum stake amount is 5 ETB!");
                return;
            }

            socket.emit("select_cartela", {
                number: number,
                stake: currentStake
            });
        }

        socket.on('cartela_selected', (data) => {
            myCartelaNumber = data.number;
            myCard = data.card;

            document.getElementById('selected-card-number').innerText = "Cartela #" + data.number;

            document.getElementById('cartela-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            renderBingoCard(data.card);
        });

        socket.on("cartela_availability", (data) => {
            if (document.getElementById("cartela-screen").style.display !== "none") {
                showCartelaList(data.available);
            }
        });

        socket.on("cartela_error", (data) => alert(data.message));

        function renderBingoCard(cardMatrix) {
            const grid = document.getElementById("bingo-grid");
            grid.innerHTML = "";

            ['B', 'I', 'N', 'G', 'O'].forEach(letter => {
                const headerCell = document.createElement("div");
                headerCell.className = "header-cell";
                headerCell.innerText = letter;
                grid.appendChild(headerCell);
            });

            for (let row = 0; row < 5; row++) {
                for (let col = 0; col < 5; col++) {
                    const number = cardMatrix[row][col];
                    const cell = document.createElement("div");

                    if (number === 0) {
                        cell.className = "cell star marked";
                        cell.innerText = "★";
                    } else {
                        cell.className = "cell";
                        cell.innerText = number < 10 ? "0" + number : number;
                        cell.id = "cell-" + number;
                        cell.onclick = () => {
                            if (drawnHistory.includes(number)) {
                                cell.classList.toggle("marked");
                                playPopSound();
                            }
                        };
                    }
                    grid.appendChild(cell);
                }
            }
        }

        socket.on("number_drawn", (data) => {
            drawnHistory.push(data.number);
            const display = data.display || (data.number < 10 ? "0" + data.number : data.number);
            document.getElementById("drawn-box").innerText = display;

            playVoiceCall(data.number);

            const isAutoMark = document.getElementById("automark-toggle").checked;
            if (isAutoMark) {
                markNumber(data.number);
            }
        });

        function markNumber(number) {
            const cell = document.getElementById("cell-" + number);
            if (cell) {
                cell.classList.add("marked");
                playPopSound();
            }
        }

        function claimBingo() {
            socket.emit("claim_bingo");
        }

        function backToCartelas() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('cartela-screen').style.display = 'block';
            socket.emit('request_cartelas');
        }

        socket.on("game_started", () => { drawnHistory = []; });
        socket.on("game_finished", () => alert("🎱 All 75 numbers have been called."));

        socket.on("game_over", (data) => {
            if (data.winner
