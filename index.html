<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yeketema Bingo</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- CDN Socket.io Client to work reliably in Telegram WebApp wrapper -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        :root {
            --bg-color: #121826;
            --card-bg: #1e293b;
            --primary: #f59e0b;
            --primary-hover: #d97706;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .header {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .username {
            font-weight: bold;
            font-size: 16px;
            color: var(--primary);
        }

        .balance {
            font-size: 14px;
            color: var(--accent);
            font-weight: 600;
        }

        .prize-pool {
            text-align: right;
            background: rgba(245, 158, 11, 0.1);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--primary);
        }

        .prize-label {
            font-size: 10px;
            color: var(--primary);
            text-transform: uppercase;
        }

        .prize-amount {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }

        /* Screen Sections */
        .screen {
            width: 100%;
            max-width: 420px;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .screen.active {
            display: flex;
        }

        /* Cartela Selection Grid */
        .grid-title {
            margin-bottom: 10px;
            font-size: 16px;
            color: var(--text-muted);
        }

        .stake-container {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            width: 100%;
        }

        .stake-btn {
            flex: 1;
            padding: 8px;
            background: var(--card-bg);
            border: 1px solid #334155;
            color: var(--text);
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .stake-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #000;
        }

        .cartela-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            width: 100%;
            max-height: 360px;
            overflow-y: auto;
            padding: 4px;
        }

        .cartela-btn {
            background: var(--card-bg);
            border: 1px solid #334155;
            color: var(--text);
            padding: 12px 0;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
        }

        .cartela-btn.disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: transparent;
        }

        /* Game Board Display */
        .drawn-number-display {
            background: radial-gradient(circle, #f59e0b 0%, #b45309 100%);
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 38px;
            font-weight: 900;
            color: #fff;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.5);
            margin: 12px 0;
        }

        .bingo-card {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            width: 100%;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        .card-header {
            font-weight: 900;
            font-size: 18px;
            text-align: center;
            color: var(--primary);
            padding-bottom: 6px;
        }

        .card-cell {
            aspect-ratio: 1;
            background: #0f172a;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
            border: 1px solid #334155;
            cursor: pointer;
            position: relative;
        }

        .card-cell.free {
            background: #1e1b4b;
            color: var(--accent);
            font-size: 12px;
        }

        .card-cell.marked {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            margin-top: 16px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        /* Admin Dashboard */
        .admin-panel {
            width: 100%;
            max-width: 420px;
            background: #1e1b4b;
            border: 1px solid #4338ca;
            border-radius: 12px;
            padding: 12px;
            margin-top: 12px;
            display: none;
        }

        .admin-title {
            font-size: 14px;
            color: #818cf8;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .admin-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .admin-btn {
            background: #312e81;
            color: #fff;
            border: 1px solid #4f46e5;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Main Header -->
    <div class="header">
        <div class="user-info">
            <span class="username" id="display-username">Connecting...</span>
            <span class="balance" id="display-balance">0.00 ETB</span>
        </div>
        <div class="prize-pool">
            <div class="prize-label">Prize Pool</div>
            <div class="prize-amount" id="display-prize">0.00 ETB</div>
        </div>
    </div>

    <!-- Screen 1: Selection Screen -->
    <div class="screen active" id="select-screen">
        <div class="grid-title">Select Stake Amount</div>
        <div class="stake-container">
            <button class="stake-btn active" onclick="setStake(10, this)">10 ETB</button>
            <button class="stake-btn" onclick="setStake(20, this)">20 ETB</button>
            <button class="stake-btn" onclick="setStake(50, this)">50 ETB</button>
            <button class="stake-btn" onclick="setStake(100, this)">100 ETB</button>
        </div>

        <div class="grid-title">Pick Your Cartela Number</div>
        <div class="cartela-grid" id="cartela-container">
            <!-- Dynamic Cartela Buttons -->
        </div>
    </div>

    <!-- Screen 2: Game Board -->
    <div class="screen" id="game-screen">
        <div class="drawn-number-display" id="drawn-ball">--</div>

        <div class="bingo-card" id="bingo-card">
            <div class="card-header">B</div>
            <div class="card-header">I</div>
            <div class="card-header">N</div>
            <div class="card-header">G</div>
            <div class="card-header">O</div>
            <!-- Dynamic 5x5 Card Grid -->
        </div>

        <button class="action-btn" onclick="claimBingo()">BINGO! 🎉</button>
    </div>

    <!-- Admin Panel -->
    <div class="admin-panel" id="admin-panel">
        <div class="admin-title">⚙️ Admin Controls</div>
        <div class="admin-controls">
            <button class="admin-btn" onclick="adminStartGame()">🚀 Start Draw</button>
            <button class="admin-btn" onclick="adminTogglePause()">⏸️ Pause/Resume</button>
        </div>
    </div>

    <script>
        // Telegram Mini App Initialization
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        // Direct server connection targeting host origin
        const socket = io(window.location.origin, {
            transports: ['websocket', 'polling'],
            reconnection: true,
            reconnectionAttempts: 10,
            reconnectionDelay: 1000
        });

        let selectedStake = 10;
        let myCardMatrix = [];
        let drawnNumbersSet = new Set();

        // Amharic Number Pronunciation Dictionary
        const amharicNumbers = {
            1: "አንድ", 2: "ሁለት", 3: "ሦስት", 4: "አራት", 5: "አምስት",
            6: "ስድስት", 7: "ሰባት", 8: "ስምንት", 9: "ዘጠኝ", 10: "አሥር",
            11: "አሥራ አንድ", 12: "አሥራ ሁለት", 13: "አሥራ ሦስት", 14: "አሥራ አራት", 15: "አሥራ አምስት",
            16: "አሥራ ስድስት", 17: "አሥራ ሰባት", 18: "አሥራ ስምንት", 19: "አሥራ ዘጠኝ", 20: "ሀያ",
            30: "ሠላሳ", 40: "አርባ", 50: "ኃምሳ", 60: "ስድሳ", 70: "ሰባ"
        };

        function getAmharicNumberText(num) {
            if (amharicNumbers[num]) return amharicNumbers[num];
            const tens = Math.floor(num / 10) * 10;
            const ones = num % 10;
            return `${amharicNumbers[tens]} ${amharicNumbers[ones]}`;
        }

        function announceAmharicNumber(num) {
            // Determine respective English letter according to standard 75-ball Bingo
            let letter = 'B';
            if (num >= 16 && num <= 30) letter = 'I';
            else if (num >= 31 && num <= 45) letter = 'N';
            else if (num >= 46 && num <= 60) letter = 'G';
            else if (num >= 61 && num <= 75) letter = 'O';

            const amharicText = getAmharicNumberText(num);
            
            // Format: English Letter + Number + Amharic Translation (e.g. "B, 1, አንድ")
            const speechText = `${letter}, ${num}, ${amharicText}`;

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(speechText);
                utterance.lang = 'am-ET';
                utterance.rate = 0.85;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Connect and Authenticate User
        socket.on('connect', () => {
            console.log('[+] Connected to Socket server');
            const user = tg?.initDataUnsafe?.user || { id: 5486724656, first_name: "Admin" };
            socket.emit('authenticate', user);
        });

        socket.on('account_data', (data) => {
            document.getElementById('display-username').innerText = data.username;
            document.getElementById('display-balance').innerText = `${data.balance.toFixed(2)} ETB`;
            
            if (data.isAdmin) {
                document.getElementById('admin-panel').style.display = 'block';
            }
        });

        socket.on('balance_updated', (data) => {
            document.getElementById('display-balance').innerText = `${data.balance.toFixed(2)} ETB`;
        });

        socket.on('prize_pool_update', (data) => {
            document.getElementById('display-prize').innerText = `${data.prize.toFixed(2)} ETB`;
        });

        // Populate Available Cartelas
        socket.on('cartela_list', (data) => {
            renderCartelaGrid(data.cartelas);
        });

        socket.on('cartela_availability', (data) => {
            renderCartelaGrid(data.available);
        });

        function renderCartelaGrid(availableList) {
            const container = document.getElementById('cartela-container');
            container.innerHTML = '';

            for (let i = 1; i <= 75; i++) {
                const btn = document.createElement('button');
                btn.className = 'cartela-btn';
                btn.innerText = i;

                if (availableList.includes(i)) {
                    btn.onclick = () => selectCartela(i);
                } else {
                    btn.classList.add('disabled');
                }
                container.appendChild(btn);
            }
        }

        function setStake(amount, element) {
            selectedStake = amount;
            document.querySelectorAll('.stake-btn').forEach(b => b.classList.remove('active'));
            element.classList.add('active');
        }

        function selectCartela(cartelaNum) {
            // Unlock browser mobile audio permissions
            if ('speechSynthesis' in window) {
                window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
            }

            socket.emit('select_cartela', { number: cartelaNum, stake: selectedStake });
        }

        socket.on('cartela_selected', (data) => {
            myCardMatrix = data.card;
            renderBingoCard(data.card);
            
            document.getElementById('select-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
        });

        function renderBingoCard(matrix) {
            const cardGrid = document.getElementById('bingo-card');
            
            // Retain headers, remove previous cells
            while (cardGrid.children.length > 5) {
                cardGrid.removeChild(cardGrid.lastChild);
            }

            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    const val = matrix[r][c];
                    const cell = document.createElement('div');
                    cell.className = 'card-cell';
                    
                    if (val === 0) {
                        cell.innerText = 'FREE';
                        cell.classList.add('free', 'marked');
                    } else {
                        cell.innerText = val;
                        cell.id = `cell-${val}`;
                    }

                    cardGrid.appendChild(cell);
                }
            }
        }

        // Live Draw Handlers
        socket.on('number_drawn', (data) => {
            const num = data.number;
            drawnNumbersSet.add(num);

            document.getElementById('drawn-ball').innerText = num;

            // Auto highlight matched number on card
            const matchedCell = document.getElementById(`cell-${num}`);
            if (matchedCell) {
                matchedCell.classList.add('marked');
            }

            // Announce in English letter + Number + Amharic Voice
            announceAmharicNumber(num);
        });

        function claimBingo() {
            socket.emit('claim_bingo');
        }

        socket.on('game_over', (data) => {
            alert(`🎉 ${data.winnerName} WON THE GAME!\nPrize: ${data.prize.toFixed(2)} ETB`);
            location.reload();
        });

        // Admin Actions
        function adminStartGame() {
            socket.emit('admin_start_game');
        }

        function adminTogglePause() {
            socket.emit('admin_toggle_pause');
        }
    </script>
</body>
</html>
